{% extends "navbar/base.html" %}
{% load static %}

{% block title %}HTV Tracker Flash Utility | Unified Portal{% endblock %}

{% block head_extra %}
<!-- Bootstrap CSS needed for modal/progress-bar JS -->
<link rel="stylesheet" href="{% static 'htv-tools-static/htv-programmer/CSS/admin-css.css' %}" />
<link rel="stylesheet" href="{% static 'htv-tools-static/htv-programmer/CSS/style.css' %}" />

<style>
    /* ═══════════════════════════════════════════════════════════
       DESIGN.MD OVERRIDE — Force Cassette Futurism over Bootstrap
       ═══════════════════════════════════════════════════════════ */

    /* Reset Bootstrap card styles */
    .card {
        background-color: #1A1A1A !important;
        border: 2px solid #524533 !important;
        border-radius: 0 !important;
        box-shadow: inset 1px 1px 0px rgba(255,255,255,0.1), 2px 2px 0px rgba(0,0,0,0.5) !important;
        color: #e5e2e1 !important;
    }
    .card-header {
        background-color: #201f1f !important;
        border-bottom: 1px solid #524533 !important;
        border-radius: 0 !important;
    }
    .card-header .m-0,
    .card-header h6 {
        color: #ffd597 !important;
        font-family: 'Space Mono', monospace !important;
        font-size: 12px !important;
        letter-spacing: 0.1em !important;
        font-weight: 700 !important;
        text-transform: uppercase !important;
        text-shadow: 0 0 6px rgba(255, 176, 0, 0.8) !important;
    }
    .card-body {
        background-color: #1A1A1A !important;
    }

    /* Page heading */
    .h3, h1.h3 {
        color: #ffd597 !important;
        font-family: 'Space Mono', monospace !important;
        font-weight: 700 !important;
        text-transform: uppercase !important;
        text-shadow: 0 0 6px rgba(255, 176, 0, 0.8) !important;
        letter-spacing: 0.02em !important;
    }

    /* Body / page background */
    .htv-tool-isolation {
        font-family: 'JetBrains Mono', monospace !important;
        background-color: #131313 !important;
        color: #e5e2e1 !important;
        padding: 24px !important;
        min-height: 100vh;
        margin-top: 0 !important;
    }

    /* Override Bootstrap buttons with mech-btn style */
    .btn-primary, .btn-info, .btn-success, .btn-warning {
        border-radius: 0 !important;
        font-family: 'Space Mono', monospace !important;
        font-size: 12px !important;
        letter-spacing: 0.1em !important;
        font-weight: 700 !important;
        text-transform: uppercase !important;
        transition: all 0.1s ease !important;
    }
    .btn-primary {
        background-color: #1A1A1A !important;
        border: 1px solid #ffd597 !important;
        color: #ffd597 !important;
        box-shadow: inset 1px 1px 0px rgba(255,255,255,0.1), 2px 2px 0px rgba(0,0,0,0.8) !important;
    }
    .btn-primary:hover {
        background-color: #ffd597 !important;
        color: #432c00 !important;
    }
    .btn-primary:active {
        transform: translate(2px, 2px) !important;
        box-shadow: none !important;
    }
    .btn-info {
        background-color: #1A1A1A !important;
        border: 1px solid #9eff8b !important;
        color: #9eff8b !important;
        box-shadow: inset 1px 1px 0px rgba(255,255,255,0.1), 2px 2px 0px rgba(0,0,0,0.8) !important;
    }
    .btn-info:hover {
        background-color: #9eff8b !important;
        color: #003a02 !important;
    }
    .btn-success {
        background-color: #ffb000 !important;
        border: 2px solid #ffd597 !important;
        color: #432c00 !important;
        box-shadow: 0 0 15px rgba(255, 176, 0, 0.6) !important;
    }
    .btn-success:hover {
        background-color: #ffba43 !important;
        box-shadow: 0 0 20px rgba(255, 176, 0, 0.8) !important;
    }
    .btn-warning {
        background-color: #1A1A1A !important;
        border: 1px solid #ffd1c0 !important;
        color: #ffd1c0 !important;
        box-shadow: inset 1px 1px 0px rgba(255,255,255,0.1), 2px 2px 0px rgba(0,0,0,0.8) !important;
    }
    .btn-warning:hover {
        background-color: #ffd1c0 !important;
        color: #5a1c00 !important;
    }
    .btn:disabled, .btn[disabled] {
        opacity: 0.4 !important;
    }

    .btn-icon-split .icon {
        background-color: transparent !important;
        border-right: 1px solid rgba(255,255,255,0.1) !important;
    }

    /* DataBox / Output Log */
    #dataBox {
        width: 100% !important;
        height: 60vh;
        min-height: 400px;
        font-family: 'JetBrains Mono', monospace !important;
        font-size: 12px !important;
        background-color: #0e0e0e !important;
        border: 1px solid #524533 !important;
        border-bottom: 1px solid #9f8e78 !important;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.5) !important;
        color: #9eff8b !important;
        text-shadow: 0 0 8px rgba(158, 255, 139, 0.9) !important;
        padding: 1rem !important;
        border-radius: 0 !important;
        resize: none;
    }

    /* Bootstrap Modals — dark theme */
    .modal-content {
        background-color: #201f1f !important;
        border: 2px solid #524533 !important;
        border-radius: 0 !important;
        color: #e5e2e1 !important;
    }
    .modal-header {
        border-bottom: 1px solid #524533 !important;
    }
    .modal-header .modal-title {
        color: #ffd597 !important;
        font-family: 'Space Mono', monospace !important;
        font-weight: 700 !important;
        text-transform: uppercase !important;
        text-shadow: 0 0 6px rgba(255, 176, 0, 0.8) !important;
    }
    .modal-body {
        color: #e5e2e1 !important;
    }
    .modal-body .small, .modal-body p {
        color: #d7c4ac !important;
        font-family: 'JetBrains Mono', monospace !important;
    }

    /* Progress bars — amber theme */
    .progress {
        background-color: #0e0e0e !important;
        border-radius: 0 !important;
        border: 1px solid #524533 !important;
        height: 8px !important;
    }
    .progress-bar {
        background-color: #ffb000 !important;
        border-radius: 0 !important;
        box-shadow: 0 0 8px rgba(255, 176, 0, 0.6) !important;
    }
    .progress-bar.bg-success {
        background-color: #9eff8b !important;
        box-shadow: 0 0 8px rgba(158, 255, 139, 0.6) !important;
    }

    /* Grid/Container overrides */
    .container-fluid {
        padding: 0 !important;
    }
    .col-xl-4, .col-xl-8, .col-lg-5, .col-lg-7 {
        padding-left: 12px !important;
        padding-right: 12px !important;
    }
    .row {
        margin-left: -12px !important;
        margin-right: -12px !important;
    }
    .shadow {
        box-shadow: inset 1px 1px 0px rgba(255,255,255,0.1), 2px 2px 0px rgba(0,0,0,0.5) !important;
    }

    /* Status text */
    .log-error { color: #ffb4ab !important; }
    .log-success { color: #9eff8b !important; }

    /* Kill Bootstrap rounded on everything */
    .rounded, .rounded-lg, .rounded-xl, .rounded-2xl, [class*="rounded"] {
        border-radius: 0 !important;
    }
</style>
{% endblock %}

{% block content %}
<div class="htv-tool-isolation">
    <div class="container-fluid">
        <!-- Page Heading -->
        <div class="d-sm-flex align-items-center justify-content-between mb-4">
            <h1 class="h3 mb-0 crt-glitch" data-text="HTV PROGRAMMER">HTV PROGRAMMER</h1>
        </div>

        <div class="row">
            <!-- Controls Card -->
            <div class="col-xl-4 col-lg-5">
                <div class="card shadow mb-4">
                    <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                        <h6 class="m-0 font-weight-bold">Controls</h6>
                    </div>
                    <div class="card-body">
                        <div class="d-flex flex-column" style="gap: 15px;">
                            <button id="openSerialPortBtn" class="btn btn-primary btn-icon-split">
                                <span class="icon text-white-50">🔌</span>
                                <span class="text">Open Serial Port</span>
                            </button>

                            <button id="selectFileBtn" class="btn btn-info btn-icon-split">
                                <span class="icon text-white-50">📂</span>
                                <span class="text">Select Binary File</span>
                            </button>

                            <hr style="border-color: #524533;">

                            <button id="updateFirmwareBtn" class="btn btn-success btn-icon-split" disabled>
                                <span class="icon text-white-50">⚡</span>
                                <span class="text">Update Firmware</span>
                            </button>

                            <button id="updateFilesBtn" class="btn btn-warning btn-icon-split" disabled>
                                <span class="icon text-white-50">📁</span>
                                <span class="text">Update Files</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Output Log Card -->
            <div class="col-xl-8 col-lg-7">
                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold">Output Log</h6>
                    </div>
                    <div class="card-body">
                        <textarea id="dataBox" readonly>HTV Tracker Flash Utility initialized...</textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modals -->
<div class="modal fade" id="fileUploadModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm" role="document">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Updating Files</h5></div>
            <div class="modal-body">
                <p id="fileWritingLabel" class="small">Writing...</p>
                <div class="progress">
                    <div id="progressBarPrograms" class="progress-bar" role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="iapFlashModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm" role="document">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Updating Firmware</h5></div>
            <div class="modal-body">
                <p id="iapFlashCountLabel" class="small">Flashing...</p>
                <div class="progress">
                    <div id="progressBarFirmware" class="progress-bar bg-success" role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'htv-tools-static/htv-programmer/JS/script.js' %}"></script>
{% endblock %}
