{% extends "navbar/base.html" %}
{% load static %}

{% block title %}HTV Tracker Flash Utility{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="{% static 'htv-tools-static/htv-programmer/CSS/admin-css.css' %}" />
<link rel="stylesheet" href="{% static 'htv-tools-static/htv-programmer/CSS/style.css' %}" />

<style>
    /* Scope everything to prevent base CSS from breaking the tool UI */
    .htv-tool-isolation {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding-top: 2rem;
        background-color: #f8f9fc;
        min-height: 100vh;
    }

    /* Force the DataBox to be responsive and fit the card */
    #dataBox {
        width: 100% !important;
        height: 60vh;
        min-height: 400px;
        font-family: 'Courier New', Courier, monospace;
        background-color: #ffffff;
        border: 1px solid #d1d3e2;
        padding: 1rem;
        border-radius: 0.35rem;
    }

    /* Retain original functional styles */
    .Available { background-color: rgba(128, 255, 128, 0.2); color: rgb(64, 128, 92); }
    .Missing { background-color: rgba(255, 128, 128, 0.2); color: rgb(255, 128, 128); }
</style>

<div class="htv-tool-isolation">
    <div class="container-fluid">
        <div class="d-sm-flex align-items-center justify-content-between mb-4">
            <h1 class="h3 mb-0 text-gray-800">HTV Tracker Flash Utility</h1>
            <span class="text-muted small">Device User: {{ user.username|default:"Guest" }}</span>
        </div>

        <div id="errBanner" class="alert alert-danger" style="display: none;">
            <span id="errBannerText"></span>
            <button class="close" type="button"><span>×</span></button>
        </div>
        <div id="successBanner" class="alert alert-success" style="display: none;">
            <span id="successBannerText"></span>
            <button class="close hide-banner-btn" type="button"><span>×</span></button>
        </div>

        <div class="card shadow mb-4">
            <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                <div class="d-flex align-items-center">
                    <h6 class="m-0 font-weight-bold text-primary">Device Status:</h6>
                    <div id="deviceInfo" class="ml-3" style="display: none">
                        <span id="boardType" class="badge badge-info"></span>
                        <small class="text-dark ml-1">v<span id="majorVersion"></span>.<span id="minorVersion"></span></small>
                    </div>
                </div>
                <div class="dropdown no-arrow">
                    <button class="btn btn-sm btn-outline-primary" id="selectFileBtn">Select Binary File</button>
                    <button id="openSerialPortBtn" class="btn btn-sm btn-primary ml-2 shadow-sm">Connect to Device</button>
                </div>
            </div>
            <div class="card-body">
                <textarea id="dataBox" readonly></textarea>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="fileUploadModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm" role="document">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Updating Files</h5></div>
            <div class="modal-body">
                <p id="fileWritingLabel" class="small"></p>
                <progress id="progressBarPrograms" value="0" max="100" class="w-100"></progress>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="iapFlashModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm" role="document">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Updating Firmware</h5></div>
            <div class="modal-body">
                <p id="iapFlashCountLabel" class="small"></p>
                <progress id="progressBarFirmware" value="0" max="100" class="w-100"></progress>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'htv-tools-static/htv-programmer/JS/script.js' %}"></script>
{% endblock %}
