{% extends "navbar/base.html" %}
{% load static %}

{% block title %}HTV Tracker Config | Unified Portal{% endblock %}

{% block content %}
<style>
    body, html {
        background-color: #111827 !important;
        margin: 0 !important;
        color: #f3f4f6 !important;
    }
    /* Darkens the sidebar container from base.html */
    aside, .sidebar, [class*="sidebar"], nav.side-nav {
        background-color: #1f2937 !important;
        border-right: 1px solid #374151 !important;
    }
    /* Fixes the content wrapper spacing and background from your inspector screenshot */
    .content-wrapper, .main-content {
        background-color: #111827 !important;
        margin-left: 7rem !important; 
        padding: 0 !important;
    }
    /* Custom scrollbar for dark mode */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #111827; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
</style>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/inputmask@5.0.8/dist/inputmask.min.js"></script>

<div class="min-h-screen bg-[#111827] p-6 md:p-10 font-sans text-gray-100">
    
    <nav class="bg-gray-800/50 border border-gray-700 p-5 mb-8 flex flex-wrap justify-between items-center rounded-2xl shadow-xl backdrop-blur-sm">
        <h1 class="text-2xl font-black tracking-tight text-white uppercase">HTV Tracker Config</h1>
        
        <div class="flex gap-6 items-center">
            <div class="flex flex-col items-center gap-1">
                <div class="signal-bars flex items-end gap-1 h-5">
                    <div class="bar bar-1 bg-gray-600 w-1 h-2 rounded-full"></div>
                    <div class="bar bar-2 bg-gray-600 w-1 h-3 rounded-full"></div>
                    <div class="bar bar-3 bg-gray-600 w-1 h-4 rounded-full"></div>
                    <div class="bar bar-4 bg-gray-600 w-1 h-5 rounded-full"></div>
                </div>
                <span class="text-[10px] font-bold text-gray-400 uppercase">Signal</span>
            </div>

            <div class="flex flex-col items-center gap-1">
                <div class="w-3 h-3 rounded-full bg-gray-600 shadow-[0_0_8px_rgba(75,85,99,0.5)]" id="sim-indicator"></div>
                <span class="text-[10px] font-bold text-gray-400 uppercase">SIM</span>
            </div>

            <div class="flex flex-col items-center gap-1">
                <div class="w-3 h-3 rounded-full bg-gray-600" id="gprs-indicator"></div>
                <span class="text-[10px] font-bold text-gray-400 uppercase">GPRS</span>
            </div>

            <div class="flex flex-col items-center gap-1">
                <div class="w-3 h-3 rounded-full bg-gray-600" id="server-indicator"></div>
                <span class="text-[10px] font-bold text-gray-400 uppercase">Server</span>
            </div>

            <div class="flex flex-col items-center gap-1">
                <div class="w-3 h-3 rounded-full bg-gray-600" id="gps-indicator"></div>
                <span class="text-[10px] font-bold text-gray-400 uppercase">GPS</span>
            </div>
        </div>
    </nav>

    <div class="flex flex-col lg:flex-row gap-8">
        
        <div class="flex flex-col bg-gray-800/40 border border-gray-700 rounded-2xl p-8 shadow-2xl w-full lg:w-1/2 backdrop-blur-sm">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <i data-feather="settings" class="w-5 h-5 text-blue-400"></i>
                    Set Parameters
                </h2>
                <div class="flex gap-2">
                    <button id="connectBtn" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-2 px-4 rounded-lg transition-all shadow-lg shadow-blue-900/20">Connect Device</button>
                </div>
            </div>

            <div class="space-y-5">
                <div class="group">
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Device IMEI</label>
                    <input type="text" id="ImeiInput" class="w-full bg-gray-900/50 border border-gray-700 rounded-xl px-4 py-3 text-gray-100 focus:border-blue-500 outline-none transition-all" readonly placeholder="Not Connected" />
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-2">APN Name</label>
                        <input type="text" id="apnInput" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 focus:border-blue-500 outline-none transition-all" />
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-2">IP Address</label>
                        <input type="text" id="ipInput" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 focus:border-blue-500 outline-none transition-all" />
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Port</label>
                        <input type="number" id="portInput" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 focus:border-blue-500 outline-none transition-all" />
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Update Rate (s)</label>
                        <input type="number" id="updateRateInput" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 focus:border-blue-500 outline-none transition-all" />
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-2">CAN Bus Protocol</label>
                    <select id="canTypeInput" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 focus:border-blue-500 outline-none transition-all appearance-none text-gray-300">
                        <option value="STDID">Standard Identifier (11-bit)</option>
                        <option value="EXTID">Extended Identifier (29-bit)</option>
                    </select>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs font-bold text-gray-400 uppercase">Configured PIDs</label>
                        <div class="flex gap-2">
                            <button id="showCanBtn" class="text-[10px] bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded text-white transition-all uppercase font-bold">Show</button>
                            <button id="hideCanBtn" class="text-[10px] bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded text-white transition-all uppercase font-bold">Hide</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-5 gap-2 bg-gray-900/50 p-4 rounded-xl border border-gray-700">
                        {% for i in "123456789" %}
                        <input type="text" id="pid{{i}}" class="bg-gray-800 border border-gray-700 rounded-lg px-2 py-2 text-center text-sm text-blue-400 font-mono focus:border-blue-500 outline-none" maxlength="4" placeholder="0000" />
                        {% endfor %}
                        <input type="text" id="pid10" class="bg-gray-800 border border-gray-700 rounded-lg px-2 py-2 text-center text-sm text-blue-400 font-mono focus:border-blue-500 outline-none" maxlength="4" placeholder="0000" />
                    </div>
                </div>
            </div>

            <div class="flex justify-between gap-4 mt-10">
                <button id="defaultConfigsBtn" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 rounded-xl transition-all">Reset Default</button>
                <div class="flex-[2] flex gap-2">
                    <button id="readConfigsBtn" class="flex-1 bg-blue-600/20 border border-blue-500/50 text-blue-400 hover:bg-blue-600 hover:text-white font-bold py-3 rounded-xl transition-all">Read Device</button>
                    <button id="saveConfigsBtn" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-blue-900/40">Apply Config</button>
                </div>
            </div>
        </div>

        <div id="received-card" class="bg-gray-800/40 border border-gray-700 rounded-2xl p-8 shadow-2xl flex flex-col w-full lg:w-1/2 backdrop-blur-sm">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <i data-feather="terminal" class="w-5 h-5 text-green-400"></i>
                    Received Data
                </h2>
                <span class="text-[10px] font-bold text-green-400 bg-green-500/10 px-2 py-1 rounded uppercase tracking-widest">Live Terminal</span>
            </div>
            <div class="flex-grow">
                <textarea id="outputTextarea" 
                    class="w-full h-[500px] bg-gray-900/80 border border-gray-700 rounded-xl px-5 py-4 resize-none font-mono text-xs leading-relaxed text-green-400 focus:border-green-500/50 outline-none shadow-inner" 
                    readonly 
                    placeholder="> Waiting for device communication..."></textarea>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/feather-icons"></script>
<script src="{% static 'htv-tools-static/htv-config/JS/utils.js' %}"></script>
<script src="{% static 'htv-tools-static/htv-config/JS/script.js' %}"></script>
<script>
    feather.replace();
</script>
{% endblock %}
