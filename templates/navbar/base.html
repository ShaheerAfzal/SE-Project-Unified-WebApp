<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Navbar{% endblock %}</title>

  <link rel="stylesheet" href="{% static 'navbar-static/CSS/style.css' %}">

  <script src="https://unpkg.com/feather-icons"></script>
  
  <style>
    /* 1. DARK THEME FIX: Set the background to #111827 to match your tools */
    body {
      background-color: #111827; 
      margin: 0;
      color: white;
    }

    /* Hide content initially */
    .content-wrapper {
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
      background-color: #111827; /* Prevents gray gutters */
    }
    
    /* Show loading indicator */
    .loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #111827; /* Changed from light to dark */
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.3s ease-in-out;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #374151; /* Darker border */
      border-top: 4px solid #3b82f6; /* Blue spinner */
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* When page is loaded, hide loading and show content */
    body.loaded .loading-indicator {
      opacity: 0;
      pointer-events: none;
    }
    
    body.loaded .content-wrapper {
      opacity: 1;
    }

    /* Ensure the navbar itself stays dark if your style.css doesn't cover it */
    .navbar {
        background-color: #1f2937 !important;
    }
  </style>
</head>
<body>
  <div class="loading-indicator">
    <div class="spinner"></div>
  </div>
  
  <div class="content-wrapper">
    <nav class="navbar" style="min-height: auto; height: fit-content;"> <ul class="navbar__menu">
    <li class="navbar__item">
        <a href="/" class="navbar__link">
            <i data-feather="home"></i>
            <span>Home</span>
        </a>
    </li>

    <li class="navbar__item">
        <a href="/api/htv_tools/config/" class="navbar__link">
            <i data-feather="tool"></i>
            <span>HTV Tools</span>
        </a>
    </li>

    <li class="navbar__item">
        <a href="/api/hls/viewer/" class="navbar__link">
            <i data-feather="tv"></i>
            <span>HLS Viewer</span>
        </a>
    </li>

    <li class="navbar__item">
        <a href="/api/shipment_forms/shipment" class="navbar__link">
            <i data-feather="package"></i>
            <span>Shipment</span>
        </a>
    </li>

    <li class="navbar__item">
        <a href="/api/serial/" class="navbar__link">
            <i data-feather="terminal"></i>
            <span>Serial Tool</span>
        </a>
    </li>
  </ul>
</nav>

    {% block content %}{% endblock %}
  </div>

  <script src="{% static 'navbar-static/JS/script.js' %}"></script>

  <script>
    window.addEventListener('load', function() {
      setTimeout(function() {
        document.body.classList.add('loaded');
        feather.replace();
      }, 100);
    });
  </script>
</body>
</html>
