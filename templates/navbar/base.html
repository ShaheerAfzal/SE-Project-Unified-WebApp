<!DOCTYPE html>
<html lang="en" class="dark">
{% load static %}
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Unified Tools Portal — Cassette Futurism industrial terminal interface for hardware configuration, monitoring, and document generation.">
  <title>{% block title %}Unified Tools Portal{% endblock %}</title>

  <!-- Canonical Fonts: Space Mono + JetBrains Mono + Courier Prime -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:wght@400;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet"/>

  <!-- Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "background": "#131313",
            "surface": "#131313",
            "surface-dim": "#131313",
            "surface-bright": "#3a3939",
            "surface-container-lowest": "#0e0e0e",
            "surface-container-low": "#1c1b1b",
            "surface-container": "#201f1f",
            "surface-container-high": "#2a2a2a",
            "surface-container-highest": "#353534",
            "surface-variant": "#353534",
            "surface-tint": "#ffba43",
            "on-surface": "#e5e2e1",
            "on-surface-variant": "#d7c4ac",
            "on-background": "#e5e2e1",
            "inverse-surface": "#e5e2e1",
            "inverse-on-surface": "#313030",
            "primary": "#ffd597",
            "on-primary": "#432c00",
            "primary-container": "#ffb000",
            "on-primary-container": "#6a4700",
            "primary-fixed": "#ffddaf",
            "primary-fixed-dim": "#ffba43",
            "on-primary-fixed": "#281800",
            "on-primary-fixed-variant": "#614000",
            "inverse-primary": "#805600",
            "secondary": "#9eff8b",
            "on-secondary": "#003a02",
            "secondary-container": "#00ec1c",
            "on-secondary-container": "#006505",
            "secondary-fixed": "#76ff65",
            "secondary-fixed-dim": "#00e61b",
            "on-secondary-fixed": "#002201",
            "on-secondary-fixed-variant": "#005303",
            "tertiary": "#ffd1c0",
            "on-tertiary": "#5a1c00",
            "tertiary-container": "#ffab8a",
            "on-tertiary-container": "#8a3000",
            "tertiary-fixed": "#ffdbce",
            "tertiary-fixed-dim": "#ffb599",
            "on-tertiary-fixed": "#370e00",
            "on-tertiary-fixed-variant": "#7f2b00",
            "error": "#ffb4ab",
            "on-error": "#690005",
            "error-container": "#93000a",
            "on-error-container": "#ffdad6",
            "outline": "#9f8e78",
            "outline-variant": "#524533"
          },
          fontFamily: {
            "headline-lg": ["Space Mono", "monospace"],
            "headline-md": ["Space Mono", "monospace"],
            "body-lg":     ["JetBrains Mono", "monospace"],
            "body-md":     ["JetBrains Mono", "monospace"],
            "label-caps":  ["Space Mono", "monospace"],
            "code-sm":     ["JetBrains Mono", "monospace"]
          },
          fontSize: {
            "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "0.05em", fontWeight: "700" }],
            "headline-md": ["24px", { lineHeight: "32px", letterSpacing: "0.02em", fontWeight: "700" }],
            "body-lg":     ["16px", { lineHeight: "24px", fontWeight: "400" }],
            "body-md":     ["14px", { lineHeight: "20px", fontWeight: "400" }],
            "label-caps":  ["12px", { lineHeight: "16px", letterSpacing: "0.1em", fontWeight: "700" }],
            "code-sm":     ["12px", { lineHeight: "16px", fontWeight: "400" }]
          },
          spacing: {
            "unit":          "4px",
            "gutter":        "16px",
            "margin":        "24px",
            "sidebar_width": "240px",
            "panel_padding": "20px"
          }
        }
      }
    }
  </script>

  <!-- Shared Design System CSS -->
  <link rel="stylesheet" href="{% static 'navbar-static/CSS/style.css' %}">

  {% block head_extra %}{% endblock %}
</head>
<body class="bg-background text-on-surface flex font-body-md overflow-hidden h-screen selection:bg-primary selection:text-on-primary">

  <!-- CRT Scanlines Overlay -->
  <div class="crt-scanlines"></div>

  <!-- ═══════════════════════════════════════════ -->
  <!-- SIDEBAR NAVIGATION RAIL                     -->
  <!-- ═══════════════════════════════════════════ -->
  <aside class="fixed top-0 left-0 w-sidebar_width h-screen bg-surface-container border-r-2 border-outline-variant flex flex-col z-40 overflow-y-auto scrollbar-hide">

    <!-- Header Zone -->
    <div class="relative px-gutter py-margin border-b border-outline-variant">
      <!-- Screw decorations -->
      <div class="screw tl"></div>
      <div class="screw tr"></div>

      <h1 class="font-headline-lg text-[20px] font-bold text-primary crt-glow-amber uppercase tracking-wider leading-tight">
        UNIFIED<br>TOOLS
      </h1>
      <span class="font-label-caps text-label-caps text-outline mt-1 block uppercase">v2.0 // PORTAL</span>
    </div>

    <!-- Navigation Items -->
    <nav class="flex-1 flex flex-col gap-unit px-2 py-gutter">

      <a id="nav-home" class="nav-item flex items-center gap-2 text-on-surface-variant border border-outline-variant p-2 hover:bg-primary hover:text-on-primary transition-all duration-75 active:translate-x-0.5 active:translate-y-0.5 font-label-caps text-label-caps uppercase" href="/">
        <span class="material-symbols-outlined text-[20px]">home</span>
        HOME
      </a>

      <a id="nav-htv" class="nav-item flex items-center gap-2 text-on-surface-variant border border-outline-variant p-2 hover:bg-primary hover:text-on-primary transition-all duration-75 active:translate-x-0.5 active:translate-y-0.5 font-label-caps text-label-caps uppercase" href="/api/htv_tools/config/">
        <span class="material-symbols-outlined text-[20px]">build</span>
        HTV TOOLS
      </a>

      <a id="nav-hls" class="nav-item flex items-center gap-2 text-on-surface-variant border border-outline-variant p-2 hover:bg-primary hover:text-on-primary transition-all duration-75 active:translate-x-0.5 active:translate-y-0.5 font-label-caps text-label-caps uppercase" href="/api/hls/viewer/">
        <span class="material-symbols-outlined text-[20px]">videocam</span>
        HLS VIEWER
      </a>

      <a id="nav-shipment" class="nav-item flex items-center gap-2 text-on-surface-variant border border-outline-variant p-2 hover:bg-primary hover:text-on-primary transition-all duration-75 active:translate-x-0.5 active:translate-y-0.5 font-label-caps text-label-caps uppercase" href="/api/shipment_forms/shipment">
        <span class="material-symbols-outlined text-[20px]">inventory_2</span>
        SHIPMENT
      </a>

      <a id="nav-serial" class="nav-item flex items-center gap-2 text-on-surface-variant border border-outline-variant p-2 hover:bg-primary hover:text-on-primary transition-all duration-75 active:translate-x-0.5 active:translate-y-0.5 font-label-caps text-label-caps uppercase" href="/api/serial/">
        <span class="material-symbols-outlined text-[20px]">terminal</span>
        SERIAL TOOL
      </a>

    </nav>

    <!-- Footer -->
    <div class="px-gutter py-2 border-t border-outline-variant">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 led-green rounded-none block"></span>
        <span class="font-code-sm text-code-sm text-outline">SYS::ONLINE</span>
      </div>
    </div>
  </aside>

  <!-- ═══════════════════════════════════════════ -->
  <!-- MAIN CONTENT AREA                           -->
  <!-- ═══════════════════════════════════════════ -->
  <main class="flex-1 ml-sidebar_width overflow-y-auto scrollbar-hide h-screen">
    {% block content %}{% endblock %}
  </main>

  <!-- Active nav highlight script -->
  <script>
    (function() {
      var path = window.location.pathname;
      var navLinks = document.querySelectorAll('.nav-item');
      navLinks.forEach(function(link) {
        var href = link.getAttribute('href');
        if (href === path || (href !== '/' && path.startsWith(href))) {
          link.classList.remove('text-on-surface-variant', 'border-outline-variant');
          link.classList.add('bg-primary-container', 'text-on-primary-container', 'border-2', 'border-primary', 'shadow-[0_0_10px_rgba(255,176,0,0.5)]');
          // Add LED indicator
          var led = document.createElement('span');
          led.className = 'ml-auto w-2 h-2 led-amber block border border-on-primary';
          link.appendChild(led);
        }
      });
    })();
  </script>
</body>
</html>
