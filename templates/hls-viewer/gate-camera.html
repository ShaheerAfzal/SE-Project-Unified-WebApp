{% extends "navbar/base.html" %}
{% load static %}

{% block title %}Gate Camera | Unified Portal{% endblock %}

{% block content %}
<div class="p-margin min-h-screen flex flex-col">

    <!-- Header -->
    <div class="flex items-center justify-between mb-gutter">
        <h1 class="font-headline-md text-headline-md font-bold text-primary crt-glow-amber uppercase crt-glitch" data-text="GATE CAMERA">GATE CAMERA</h1>
        <button id="loadVideo" class="mech-btn mech-btn-primary">
            <span class="material-symbols-outlined text-[18px]">refresh</span>
            RELOAD VIDEO
        </button>
    </div>

    <!-- Fullscreen Video Panel -->
    <div class="chassis-panel p-2 relative flex-1">
        <div class="screw tl"></div><div class="screw tr"></div>
        <div class="screw bl"></div><div class="screw br"></div>

        <video id="video" controls autoplay class="w-full h-full object-cover"></video>

        <div class="hidden">
            <label for="videoSrc" class="font-label-caps text-label-caps text-on-surface-variant uppercase">Video Source URL:</label>
            <input type="text" id="videoSrc" class="recessed-input w-full p-2 text-primary font-code-sm crt-glow-amber"
                   value="http://192.168.100.36:8080/a0b584f2f75b7ce5e75ce90acd30ec4c/hls/yoTi3XbV3z/giXfaH3Vxi/s.m3u8" />
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
    var video = document.getElementById('video');
    var videoSrcInput = document.getElementById('videoSrc');
    var defaultVideoSrc = videoSrcInput.value;

    function loadVideo(src) {
        if (Hls.isSupported()) {
            var hls = new Hls();
            hls.loadSource(src);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = src;
            video.addEventListener('loadedmetadata', function() { video.play(); });
        }
    }

    document.getElementById('loadVideo').addEventListener('click', function() {
        var newSrc = videoSrcInput.value || defaultVideoSrc;
        loadVideo(newSrc);
    });

    loadVideo(defaultVideoSrc);

    // Add error handling function
    function handleVideoErrors() {
        video.addEventListener('error', function(e) {
            console.error('Video error:', e);
            alert('Error loading video stream. Please check the URL and try again.');
        });

        video.addEventListener('waiting', function() {
            console.log('Video buffering...');
        });

        video.addEventListener('playing', function() {
            console.log('Video playback started');
        });
    }

    // Call this function after your existing loadVideo function
    handleVideoErrors();
</script>
{% endblock %}
